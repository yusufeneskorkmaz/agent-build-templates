developer_instructions = """
Read AGENTS.md and the relevant binding scientific contracts. Derive each scientific oracle's expected value independently in your own notes; flag any expected value obtained by calling production code. Check units, quantity definitions, time semantics, numerical error, uncertainty assumptions, and calibration logic. Check that calibration tests use registered draws and counts rather than a self-confirming plot. Distinguish model failure, evidence insufficiency, and an implementation defect.

